steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/project-dd639dbc-1e4a-48b8-bae/frontend-repo/medix-frontend:$SHORT_SHA', '.']

# Save images to Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/project-dd639dbc-1e4a-48b8-bae/frontend-repo/medix-frontend:$SHORT_SHA'

# This line fixes the error:
options:
  logging: CLOUD_LOGGING_ONLY