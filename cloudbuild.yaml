steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg=NEXT_PUBLIC_API_GATEWAY_URL=http://136.69.15.83/api/v1'
      - '-t'
      - 'us-central1-docker.pkg.dev/project-dd639dbc-1e4a-48b8-bae/frontend-repo/medix-frontend:$SHORT_SHA'
      - '.'

# THIS IS THE MISSING PIECE: Tells Cloud Build to push the image to Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/project-dd639dbc-1e4a-48b8-bae/frontend-repo/medix-frontend:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY